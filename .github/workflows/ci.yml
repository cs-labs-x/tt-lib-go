name: ci

# Este repositorio es público, así que también se construye en pull
# requests — a diferencia de los 55 repos privados, aquí no hay cuota de
# Actions de la organización que proteger, y es la dependencia de todos
# ellos: conviene saber si una PR la rompe antes de mergear.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go build ./...
      - run: go test ./...
